<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>JARONA!</title>
<style>
  html { overflow-x: hidden; }
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 14px 20px 30px;
    background-color: #ffd83d; color: #3b1f00;
    font-family: "Courier New", Courier, monospace; font-weight: bold;
    text-align: center; overflow-x: hidden;
  }
  h1 { margin: 0 0 14px; font-weight: bold; font-size: 72px; line-height: 1; letter-spacing: 1px; text-shadow: 3px 3px 0 #fff3a6; text-align: center; }

  /* Los tamaños en píxeles los calcula el script (función layout) */
  .stage { position: relative; width: 384px; margin: 0 auto; }
  .push {
    position: relative; display: block; width: 100%; height: 538px;
    border: 0; padding: 0; margin: 0;
    -webkit-appearance: none; background: transparent; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
    -webkit-transform-origin: 50% 100%; transform-origin: 50% 100%;
    -webkit-transition: -webkit-transform .08s ease-out;
  }
  .sprite, .omega canvas, .char, .tree {
    image-rendering: -webkit-optimize-contrast; image-rendering: pixelated;
    pointer-events: none; -webkit-user-drag: none; -webkit-user-select: none;
  }
  #flowery { width: 141px; height: 384px; }
  #pose { width: 262px; height: 339px; }
  .power { width: 211px; height: 467px; }
  .sprite { display: block; position: absolute; left: 50%; bottom: 0; -webkit-transform: translateX(-50%); transform: translateX(-50%); }

  .slide { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }
  .omega {
    position: absolute; left: 50%; bottom: 19px; width: 256px; height: 512px; margin-left: -128px;
    -webkit-animation: floaty 2.6s ease-in-out infinite alternate;
  }
  .omega canvas { display: block; width: 100%; height: 100%; }
  @-webkit-keyframes floaty { from { -webkit-transform: translateY(0); } to { -webkit-transform: translateY(-14px); } }

  .orbit { position: absolute; left: 0; top: 0; width: 100%; height: 538px; z-index: 60; pointer-events: none; }
  .char { position: absolute; left: 50%; top: 307px; }

  .push.down { -webkit-transform: translateY(8px) scale(1.04, .94); }
  .push.hop  { -webkit-animation: hop .38s ease-out; }
  @-webkit-keyframes hop {
    0%   { -webkit-transform: translateY(8px) scale(1.04, .94); }
    45%  { -webkit-transform: translateY(-14px) rotate(-3deg) scale(.98, 1.03); }
    100% { -webkit-transform: none; }
  }
  .push:focus { outline: none; }

  .floor { width: 218px; height: 18px; margin: 4px auto 0; border-radius: 50%; -webkit-border-radius: 50%; background: rgba(59, 31, 0, .22); }
  .floor.hover { -webkit-animation: shade 2.6s ease-in-out infinite alternate; }
  @-webkit-keyframes shade { from { -webkit-transform: scale(1); opacity: 1; } to { -webkit-transform: scale(.78); opacity: .65; } }

  .swap {
    display: block; margin: 16px auto 0; height: 46px; padding: 0 20px;
    font: bold 18px "Courier New", Courier, monospace;
    color: #3b1f00; background: #fff3a6;
    border: 3px solid #3b1f00; border-radius: 12px; -webkit-border-radius: 12px;
    -webkit-box-shadow: 0 4px 0 #3b1f00; box-shadow: 0 4px 0 #3b1f00; cursor: pointer;
  }
  .swap:active { -webkit-transform: translateY(3px); -webkit-box-shadow: 0 1px 0 #3b1f00; box-shadow: 0 1px 0 #3b1f00; }
  .swap:focus { outline: 3px solid #3b1f00; outline-offset: 4px; }
  .swap.locked { visibility: hidden; }
  .swap.pop { -webkit-animation: unlock .45s ease-out; }
  @-webkit-keyframes unlock { from { -webkit-transform: scale(.5); opacity: 0; } to { -webkit-transform: none; opacity: 1; } }

  /* Escena secreta: árbol sobre fondo negro (centrado con tabla: no hay flexbox en este navegador) */
  .secret { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 100; background: #000; display: table; opacity: 0; -webkit-transition: opacity .5s ease; }
  .secret.show { opacity: 1; }
  .secret:focus { outline: none; }
  .cell { display: table-cell; vertical-align: middle; text-align: center; }
  .tree { width: 560px; height: auto; }

  #flash { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 50; background: #fff; opacity: 0; pointer-events: none; }
  #dbg { position: fixed; left: 6px; top: 4px; z-index: 200; max-width: 94%; padding: 4px 8px; white-space: pre-wrap; word-wrap: break-word; font: 16px/1.3 monospace; color: #3b1f00; background: #fff; pointer-events: none; }

  /* Pantalla de carga */
  #loading { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 150; background: #ffd83d; display: table; -webkit-transition: opacity .4s ease; }
  #loading.out { opacity: 0; pointer-events: none; }
  #loading h2 { margin: 0 0 28px; font-size: 80px; line-height: 1; text-shadow: 3px 3px 0 #fff3a6; }
  .bar { width: 520px; max-width: 80%; height: 28px; margin: 0 auto; border: 4px solid #3b1f00; border-radius: 10px; -webkit-border-radius: 10px; background: #fff3a6; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: #3b1f00; }
  #ltext { margin: 16px 0 0; font-size: 22px; min-height: 30px; }
  #go { margin-top: 22px; height: 56px; padding: 0 28px; font: bold 24px "Courier New", Courier, monospace; color: #3b1f00; background: #fff3a6; border: 4px solid #3b1f00; border-radius: 14px; -webkit-border-radius: 14px; -webkit-box-shadow: 0 5px 0 #3b1f00; cursor: pointer; }
  #go:focus { outline: 4px solid #3b1f00; outline-offset: 5px; }
</style>
</head>

  // ---- Cambiar entre Flowery y Omega (se desbloquea tras la transformacion) ----
  function unlockSwap() {
    swap.className = reduce ? "swap" : "swap pop";
    swap.disabled = false;
  }
  swap.addEventListener("click", function () {
    if (phase === "omega") {
      phase = "normal";
      setHidden(slide, true);
      setHidden(flowery, false);
      floor.className = "floor";
      swap.textContent = "Cambiar a Omega Flowery";
    } else if (phase === "normal") {
      phase = "omega";
      clearTimeout(poseTimer);
      setHidden(pose, true);
      setHidden(flowery, true);
      setHidden(slide, false);
      floor.className = "floor hover";
      swap.textContent = "Cambiar a Flowery";
    }
    hop();
    swapped();
  }, false);

  // ---- Interaccion (raton, pantalla tactil, mando de la consola o teclado) ----
  function hop() {
    removeClass(push, "hop"); void push.offsetWidth; addClass(push, "hop");
  }
  var downHandled = false, downTimer = 0;
  function down() {
    clearTimeout(downTimer);
    downHandled = true;
    if (onPress(true)) {
      removeClass(push, "hop");
      addClass(push, "down");
    }
  }
  function up() {
    downTimer = setTimeout(function () { downHandled = false; }, 700);
    if (hasClass(push, "down")) {
      removeClass(push, "down"); hop();
      if (!isHidden(pose)) { clearTimeout(poseTimer); poseTimer = setTimeout(showStand, POSE_MS); }
    }
  }
  if (window.PointerEvent) {
    push.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      down();
    }, false);
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (n) { push.addEventListener(n, up, false); });
  } else {
    var lastTouch = 0;
    push.addEventListener("touchstart", function () { lastTouch = Date.now(); down(); }, false);
    push.addEventListener("touchend", up, false);
    push.addEventListener("touchcancel", up, false);
    push.addEventListener("mousedown", function (e) {
      if (Date.now() - lastTouch < 800 || (e.button && e.button !== 0)) return;   // ignora el raton simulado tras un toque
      down();
    }, false);
    push.addEventListener("mouseup", up, false);
    push.addEventListener("mouseleave", up, false);
  }
  // Si el clic no viene precedido de una pulsacion (teclado, mando de consola), cuenta como un toque completo
  push.addEventListener("click", function () {
    if (downHandled) return;
    if (onPress()) hop();
  }, false);

  // Los navegadores no dejan sonar nada antes de una interaccion
  ["mousedown", "mouseup", "touchstart", "touchend", "pointerdown", "pointerup", "click", "keydown"].forEach(function (n) {
    document.addEventListener(n, function () { snd.unlock(); watchWeb(); }, false);
  });
  // Sin musica cuando la pestana no esta a la vista
  document.addEventListener("visibilitychange", function () { snd.refreshMusic(); }, false);
  document.addEventListener("webkitvisibilitychange", function () { snd.refreshMusic(); }, false);

  // ---- Estado en pantalla ----
  var lastDbg = "";
  setInterval(function () {
    if (!dbgEl) return;
    var vw = window.innerWidth || 0, vh = window.innerHeight || 0;
    var t = (window.__err ? window.__err + " | " : "") + snd.info() + " | U:" + U.toFixed(1) + " " + vw + "x" + vh + " | toques:" + taps + " " + phase;
    if (t !== lastDbg) { lastDbg = t; dbgEl.textContent = t; }
  }, 1000);

  // =====================================================================
  //  AUDIO (PS3)
  //  El navegador de la PS3 es un NetFront muy antiguo: no tiene Web Audio y, segun lo que
  //  se ha documentado, tampoco <audio>. Por eso hay tres motores y el juego elige el primero
  //  que parezca funcionar (se puede forzar con ?audio=native, ?audio=embed o ?audio=none):
  //    native -> un solo <audio> con todos los sonidos en un archivo (audio/mix.mp3)
  //    embed  -> experimental: un <embed> invisible por sonido (archivos individuales)
  //    none   -> sin sonido (la pagina funciona igual)
  // =====================================================================
  var EXTS = [".mp3"];
  var lastAudioErr = "";
  function aerr(m) { lastAudioErr = m; }
  function watchWeb() {}

  // ---------- Motor 2: UN solo <audio> con todos los sonidos en un mismo archivo ("sprite") ----------
  // La PS4 no tiene Web Audio y solo deja sonar un <audio> a la vez, asi que todo va en un unico
  // archivo (audio/mix.mp3): efectos primero y la musica al final. Un efecto salta a su tramo,
  // suena, y la musica continua donde se quedo (durante el efecto la musica calla).
  var SPRITE = {"jarona": {"s": 0.3, "d": 1.28}, "ultimo": {"s": 1.88, "d": 3.284}, "omega": {"s": 5.464, "d": 4.355}, "poder": {"s": 10.119, "d": 4.481}, "secreto": {"s": 14.901, "d": 59.485}, "music": {"s": 74.686, "d": 192.037}};
  function makeSpriteAudio() {
    var el = new Audio(), ext = 0, mode = "music", started = false;
    var fxEnd = 0, fxCb = null, musicPos = SPRITE.music.s, fadeT = 0;
    var fxSeg = null, fxArmed = false, fxStart = 0, fxTries = 0;
    function now() { return Date.now(); }
    el.preload = "auto"; el.loop = false;
    el.addEventListener("error", function () {
      if (ext + 1 < EXTS.length) { ext++; el.src = "audio/mix" + EXTS[ext]; try { el.load(); } catch (e) {} }
      else aerr("mix error " + (el.error ? el.error.code : "?"));
    }, false);
    el.src = "audio/mix" + EXTS[0];
    try { el.load(); } catch (e) {}

    function setVol(v) { try { el.volume = Math.max(0, Math.min(1, v)); } catch (e) {} }
    function seek(t) { try { el.currentTime = t; } catch (e) { aerr("seek " + e); } }
    function safePlay() {
      try {
        var p = el.play();
        if (p && p["catch"]) p["catch"](function (e) { aerr("play " + (e && e.name ? e.name : e)); });
      } catch (e) { aerr("play " + e); }
    }
    function whenMeta(fn) {   // no se puede saltar a un punto hasta conocer la duracion del archivo
      if (el.readyState >= 1) { fn(); return; }
      var done = false;
      function once() { if (done) return; done = true; el.removeEventListener("loadedmetadata", once, false); fn(); }
      el.addEventListener("loadedmetadata", once, false);
    }
    function isBuffered(t) {
      try {
        for (var i = 0; i < el.buffered.length; i++) if (el.buffered.start(i) <= t + 0.1 && el.buffered.end(i) >= t + 1.5) return true;
      } catch (e) {}
      return false;
    }
    function seekSafe(t, fn) {   // espera a que ese tramo ya este descargado antes de saltar (evita saltos que fallan)
      whenMeta(function () {
        var tries = 0;
        (function go() {
          if (isBuffered(t) || tries++ > 80) { seek(t); if (fn) fn(); } else setTimeout(go, 100);
        })();
      });
    }
    function fadeTo(to, secs) {
      var from = el.volume, n = Math.max(1, Math.round(secs * 20)), i = 0;
      clearInterval(fadeT);
      fadeT = setInterval(function () { i++; setVol(from + (to - from) * i / n); if (i >= n) clearInterval(fadeT); }, 50);
    }
    function endFx() {
      var cb = fxCb; fxCb = null;
      if (secretOn) { mode = "secret"; setVol(1); seek(SPRITE.secreto.s - 0.05); }
      else { mode = "music"; setVol(musicLevel()); seek(musicPos); }
      if (cb) cb();
    }
    // Vigila el punto de reproduccion: termina los efectos y repite la musica / el secreto
    setInterval(function () {
      if (!started || el.readyState < 2) return;
      var t = el.currentTime;
      if (mode === "fx") {
        // Tras saltar, la posicion tarda un poco en actualizarse: hasta que no este dentro del tramo
        // del efecto no se puede dar por terminado (si no, un efecto como Omega se cortaba antes de sonar).
        if (!fxArmed) {
          if (t >= fxSeg.s - 0.25 && t <= fxEnd + 0.05) fxArmed = true;
          else if (now() - fxStart > 900) {          // el salto no se hizo: se repite
            if (++fxTries > 4) { endFx(); return; }
            fxStart = now(); seek(fxSeg.s - 0.06); if (el.paused) safePlay();
          }
        } else if (t >= fxEnd || now() - fxStart > fxSeg.d * 1000 + 1500) endFx();
      }
      else if (mode === "music") { if (t >= SPRITE.music.s + SPRITE.music.d - 0.05 && t < SPRITE.music.s + SPRITE.music.d + 5) seek(SPRITE.music.s); }
      else if (mode === "secret") { if (t >= SPRITE.secreto.s + SPRITE.secreto.d - 0.05) seek(SPRITE.secreto.s - 0.05); }
    }, 25);

    function frac() {
      try {
        if (!el.duration || !el.buffered || !el.buffered.length) return 0;
        return Math.min(1, el.buffered.end(el.buffered.length - 1) / el.duration);
      } catch (e) { return 0; }
    }
    return {
      progress: function () {
        var f = frac();
        return { l: (f >= 0.99 || el.readyState >= 4) ? 1 : f * 0.98, t: 1 };
      },
      unlock: function () {
        if (!started) {
          started = true;
          setVol(0);
          safePlay();   // dentro del toque: asi el navegador deja usar este audio despues sin mas toques
          seekSafe(SPRITE.music.s, function () { mode = "music"; fadeTo(musicLevel(), 1.5); });
        } else if (el.paused) {
          safePlay();   // si el navegador lo paro, un nuevo toque lo reanuda
        }
      },
      play: function (name, onEnd) {
        var seg = SPRITE[name];
        if (!seg || name === "music" || name === "secreto") { if (onEnd) setTimeout(onEnd, 1300); return; }
        if (secretOn || !started) { if (onEnd) setTimeout(onEnd, seg.d * 1000); return; }
        if (mode === "music") {
          var t = el.currentTime;
          musicPos = (t >= SPRITE.music.s && t < SPRITE.music.s + SPRITE.music.d) ? t : SPRITE.music.s;
        }
        var prev = fxCb; fxCb = onEnd || null; if (prev) prev();
        mode = "fx"; fxEnd = seg.s + seg.d; fxSeg = seg; fxArmed = false; fxStart = now(); fxTries = 0;
        clearInterval(fadeT);
        setVol(1);
        whenMeta(function () { seek(seg.s - 0.06); if (el.paused) safePlay(); });
      },
      duration: function (name, fb) { return SPRITE[name] ? SPRITE[name].d * 1000 : fb; },
      refreshMusic: function () { if (mode === "music") fadeTo(musicLevel(), 0.4); },
      hasSecret: function () { return true; },
      clockStuck: function () { return false; },
      info: function () {
        return "SPRITE " + mode + " rs:" + el.readyState + " t:" + (el.currentTime || 0).toFixed(1) + " cargado:" + Math.round(frac() * 100) + "%" + (el.paused ? " PAUSADO" : "") + (lastAudioErr ? " ERR:" + lastAudioErr : "");
      },
      enterSecret: function () {
        mode = "secret"; fxCb = null;
        clearInterval(fadeT);
        setVol(1);
        seekSafe(SPRITE.secreto.s - 0.05, function () { if (el.paused) safePlay(); });
      }
    };
  }


  // ---------- Motor "embed" (experimental): archivos individuales ----------
  function makeEmbedAudio() {
    var box = document.createElement("div");
    box.style.cssText = "position:absolute;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01";
    document.body.appendChild(box);
    var live = {}, musicEl = null, musicWanted = false, secretEl2 = null, made = 0;
    function mk(name, loop) {
      var e = document.createElement("embed");
      e.setAttribute("src", "audio/" + name + ".mp3");
      e.setAttribute("type", "audio/mpeg");
      e.setAttribute("width", "1"); e.setAttribute("height", "1");
      e.setAttribute("autostart", "true"); e.setAttribute("autoplay", "true");
      e.setAttribute("loop", loop ? "true" : "false");
      e.setAttribute("volume", "100");
      box.appendChild(e); made++;
      return e;
    }
    function kill(e) { try { if (e && e.parentNode) e.parentNode.removeChild(e); } catch (x) {} }
    var FILE = { music: "musica", secreto: "secreto" };
    return {
      progress: function () { return { l: 1, t: 1 }; },
      unlock: function () {
        if (!musicEl && !secretOn) { musicEl = mk("musica", true); }
      },
      play: function (name, onEnd) {
        var seg = SPRITE[name];
        if (!seg || secretOn) { if (onEnd) setTimeout(onEnd, seg ? seg.d * 1000 : 1300); return; }
        kill(live[name]);
        var e = mk(name, false); live[name] = e;
        setTimeout(function () { if (live[name] === e) { kill(e); live[name] = null; } }, seg.d * 1000 + 600);
        if (onEnd) setTimeout(onEnd, seg.d * 1000);
      },
      duration: function (name, fb) { return SPRITE[name] ? SPRITE[name].d * 1000 : fb; },
      refreshMusic: function () {},
      hasSecret: function () { return true; },
      clockStuck: function () { return false; },
      info: function () { return "EMBED (experimental) creados:" + made + (lastAudioErr ? " ERR:" + lastAudioErr : ""); },
      enterSecret: function () { kill(musicEl); musicEl = null; secretEl2 = mk("secreto", true); }
    };
  }

  // ---------- Sin audio ----------
  function makeNoAudio() {
    return {
      progress: function () { return { l: 1, t: 1 }; },
      unlock: function () {},
      play: function (name, onEnd) { if (onEnd) setTimeout(onEnd, 1300); },
      duration: function (name, fb) { return SPRITE[name] ? SPRITE[name].d * 1000 : fb; },
      refreshMusic: function () {},
      hasSecret: function () { return true; },
      clockStuck: function () { return false; },
      info: function () { return "SIN AUDIO"; },
      enterSecret: function () {}
    };
  }

  function nativeAudioWorks() {
    try {
      if (typeof window.Audio === "undefined") return false;
      var a = new Audio();
      if (!a.canPlayType) return false;
      var r = a.canPlayType("audio/mpeg");
      return r === "probably" || r === "maybe";
    } catch (e) { return false; }
  }

  function initAudio() {
    var forced = (/[?&]audio=(\w+)/.exec(location.search) || [])[1];
    var how = forced || (nativeAudioWorks() ? "native" : "embed");
    try {
      if (how === "native") snd = makeSpriteAudio();
      else if (how === "embed") snd = makeEmbedAudio();
      else snd = makeNoAudio();
    } catch (err) { report("audio: " + err); snd = makeNoAudio(); }
    report("motor de audio: " + how + " | Audio:" + (typeof window.Audio) + " | " + navigator.userAgent);
  }
  setTimeout(initAudio, 300);

  // ---- Pantalla de carga: espera al audio y a la hoja de Omega; el boton "Empezar" es el primer toque ----
  var loadingEl = $("loading"), lbar = $("lbar"), ltext = $("ltext"), goBtn = $("go");
  var loadT0 = nowMs(), loadDone = false, shown = 0;
  function finishLoading() {
    if (loadDone) return;
    loadDone = true;
    lbar.style.width = "100%";
    ltext.textContent = "\u00a1Listo!";
    setHidden(goBtn, false);
    try { goBtn.focus(); } catch (e) {}
  }
  var loadTimer = setInterval(function () {
    if (loadDone) { clearInterval(loadTimer); return; }
    var pr = snd.progress ? snd.progress() : { l: 0, t: 6 };
    var l = pr.l + (omegaReady ? 1 : 0), t = pr.t + 1;
    var pct = Math.min(99, Math.floor(100 * l / t));
    if (pct > shown) shown = pct;
    lbar.style.width = shown + "%";
    ltext.textContent = "Cargando... " + shown + "%";
    var waited = nowMs() - loadT0;
    if (l >= t || waited > 12000) finishLoading();   // si algo tarda demasiado, se deja entrar igualmente
  }, 150);
  function startGame() {
    if (!loadDone) return;
    snd.unlock(); watchWeb();            // primer toque real: desbloquea el audio y arranca la musica
    loadingEl.className = "out";
    setTimeout(function () { setHidden(loadingEl, true); }, 450);
    try { push.focus(); } catch (e) {}
  }
  goBtn.addEventListener("click", startGame, false);
})();
</script>
</body>
